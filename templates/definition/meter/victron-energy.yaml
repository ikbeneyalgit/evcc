template: victron-energy
products:
  - brand: Victron
    description:
      generic: Energy
requirements:
  description:
    de: Für Grid-Nutzung ist eine VRM-Instanz notwendig wenn Lastmanagement genutzt werden soll.
    en: For grid usage, a grid meter VRM instance is require to enabled load management.
capabilities: ["battery-control"]
discovery:
  hostname: ["venus"]
  mac: ["C0619AB"]
params:
  - name: usage
    choice: ["grid", "pv", "battery"]
  - name: modbus
    choice: ["tcpip"]
  - name: maxacpower
  - name: meterid # grid meter VRM instance
    description:
      en: Grid meter VRM instance
      de: Grid-Energiezähler VRM Instanz
    type: int
    usages: ["grid"]
    help:
      de: "Kann im VRM Portal oder im RemoteUI ausgelesen werden."
      en: "Can be read out in VRM portal or via remoteUI."
  - preset: battery-params
  - name: griddischarge
    type: bool
    default: false
    usages: ["battery"]
    advanced: true
    description:
      de: Netzentladen
      en: Discharge to grid
    help:
      de: Erlaubt die aktive Entladung der Batterie ins Netz über den ESS-Netzsollwert. Dynamic ESS muss deaktiviert sein.
      en: Allows actively discharging the battery to the grid via ESS grid setpoint. Dynamic ESS must be disabled.
render: |
  type: custom
  {{- if eq .usage "grid" }}
  power:
    source: calc
    add:
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: 100 # com.victronenergy.system
      register:
        address: 820 # L1 grid power
        type: input
        decode: int16
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: 100 # com.victronenergy.system
      register:
        address: 821 # L2 grid power
        type: input
        decode: int16
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: 100 # com.victronenergy.system
      register:
        address: 822 # L3 grid power
        type: input
        decode: int16
  {{- if .meterid }}
  currents:
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: {{ .meterid }}
      register:
        address: 2617 # L1 grid current
        type: input
        decode: int16
      scale: 0.1
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: {{ .meterid }}
      register:
        address: 2619 # L2 grid current
        type: input
        decode: int16
      scale: 0.1
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: {{ .meterid }}
      register:
        address: 2621 # L3 grid current
        type: input
        decode: int16
      scale: 0.1
  {{- end }}
  {{- end }}
  {{- if eq .usage "pv" }}
  power:
    source: calc
    add:
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: 100 # com.victronenergy.system
      register:
        address: 808 # ACout pv power L1
        type: input
        decode: uint16
      block: # 808-813
        register: 808
        count: 6
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: 100 # com.victronenergy.system
      register:
        address: 809 # ACout pv power L2
        type: input
        decode: uint16
      block: # 808-813
        register: 808
        count: 6
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: 100 # com.victronenergy.system
      register:
        address: 810 # ACout pv power L3
        type: input
        decode: uint16
      block: # 808-813
        register: 808
        count: 6
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: 100 # com.victronenergy.system
      register:
        address: 811 # ACin pv power L1
        type: input
        decode: uint16
      block: # 808-813
        register: 808
        count: 6
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: 100 # com.victronenergy.system
      register:
        address: 812 # ACin pv power L2
        type: input
        decode: uint16
      block: # 808-813
        register: 808
        count: 6
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: 100 # com.victronenergy.system
      register:
        address: 813 # ACin pv power L3
        type: input
        decode: uint16
      block: # 808-813
        register: 808
        count: 6
    - source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: 100 # com.victronenergy.system
      register:
        address: 850 # DC pv power
        type: input
        decode: uint16
  maxacpower: {{ .maxacpower }}
  {{- end }}
  {{- if eq .usage "battery" }}
  power:
    source: modbus
    {{- include "modbus-connection" . | indent 2 }}
    id: 100 # com.victronenergy.system
    register:
      address: 842 # active DC power
      type: input
      decode: int16
    scale: -1
  soc:
    source: modbus
    {{- include "modbus-connection" . | indent 2 }}
    id: 100 # com.victronenergy.system
    register:
      address: 843 # Soc
      type: input
      decode: uint16
  limitsoc:
    source: convert
    convert: float2int
    set:
      source: modbus
      {{- include "modbus-connection" . | indent 4 }}
      id: 100 # com.victronenergy.system
      register:
        address: 2901 # limit soc
        type: writesingle
        decode: uint16
      scale: 10
  {{- if .griddischarge }}
  # only discharge sets the grid setpoint override (2716), all other modes release it
  # so ESS falls back to the grid setpoint configured on the GX (2700)
  batterymode:
    source: watchdog
    timeout: 5m # the GX drops the override 5 minutes after the last write, re-write at timeout/2
    reset: [1, 2, 3] # modes that release the override need no refresh
    set:
      source: switch
      switch:
      - case: 1 # normal
        set:
          source: const
          value: 0 # release override
          set:
            source: modbus
            {{- include "modbus-connection" . | indent 10 }}
            id: 100 # com.victronenergy.hub4
            register:
              address: 2716 # grid setpoint override (volatile)
              type: writemultiple
              encoding: int32
      - case: 2 # hold
        set:
          source: const
          value: 0 # release override
          set:
            source: modbus
            {{- include "modbus-connection" . | indent 10 }}
            id: 100 # com.victronenergy.hub4
            register:
              address: 2716 # grid setpoint override (volatile)
              type: writemultiple
              encoding: int32
      - case: 3 # charge
        set:
          source: const
          value: 0 # release override
          set:
            source: modbus
            {{- include "modbus-connection" . | indent 10 }}
            id: 100 # com.victronenergy.hub4
            register:
              address: 2716 # grid setpoint override (volatile)
              type: writemultiple
              encoding: int32
      - case: 5 # discharge
        set:
          source: sequence
          set:
          # limitsoc is not applied for discharge, a preceding hold or charge would block discharging
          - source: const
            value: {{ .minsoc }}
            set:
              source: modbus
              {{- include "modbus-connection" . | indent 12 }}
              id: 100 # com.victronenergy.settings
              register:
                address: 2901 # limit soc
                type: writesingle
                decode: uint16
              scale: 10
          - source: const
            # grid export target, the battery covers export plus house load. Without maxdischargepower
            # the export is capped by the GX feed-in and discharge limits and the inverter rating
            value: {{ if .maxdischargepower }}-{{ .maxdischargepower }}{{ else }}-100000{{ end }}
            set:
              source: modbus
              {{- include "modbus-connection" . | indent 12 }}
              id: 100 # com.victronenergy.hub4
              register:
                address: 2716 # grid setpoint override (volatile)
                type: writemultiple
                encoding: int32
  {{- end }}
  {{- include "battery-params" . }}
  {{- end }}
